site_name: Defra architecture
site_description: >-
  Architecture handrails, guardrails and governance for Defra digital, data and
  technology - for internal product and platform teams and delivery partners.
site_url: https://howellsr.github.io/architecture/
repo_url: https://github.com/howellsr/architecture
repo_name: howellsr/architecture
edit_uri: edit/main/docs/
remote_branch: gh-pages

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
copyright: >-
  Contains public sector information licensed under the
  <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/">Open Government Licence v3.0</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: img/code-white.png
  favicon: img/code-black.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/defra.css

extra_javascript:
  - javascripts/site.js

hooks:
  - hooks/capabilities.py
  - hooks/guardrails.py

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DEFRA
      name: Defra on GitHub
    - icon: fontawesome/solid/code
      link: https://defra.github.io/software-development-standards/
      name: Defra software development standards
    - icon: fontawesome/solid/book
      link: https://digital.defra.gov.uk/service-manual
      name: Defra Digital Service Manual
    - icon: fontawesome/solid/blog
      link: https://defradigital.blog.gov.uk/
      name: Defra Digital blog

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home:
      - index.md
      - Using this site: about/using-this-site.md
      - Working with us as a delivery partner: about/delivery-partners.md
      - The architecture team: about/team.md
      - What's new: about/changelog.md
  - Guardrails:
      - guardrails/index.md
      - Guardrail library: guardrails/library.md
      - Architecture principles: guardrails/principles.md
      - Choosing technology: guardrails/choosing-technology.md
      - Hosting and platforms: guardrails/hosting-and-platforms.md
      - Software development: guardrails/software-development.md
      - APIs and integration: guardrails/apis-and-integration.md
      - Identity and access: guardrails/identity-and-access.md
      - Data: guardrails/data.md
      - Security: guardrails/security.md
      - Observability and operations: guardrails/observability-and-operations.md
      - Front end and accessibility: guardrails/front-end-and-accessibility.md
      - Open source and working in the open: guardrails/open-source.md
      - Artificial intelligence: guardrails/ai.md
      - Sustainability: guardrails/sustainability.md
      - Software development standards: https://defra.github.io/software-development-standards/
  - Handrail:
      - handrail/index.md
      - Business capabilities: handrail/business-capabilities.md
      - Technology capabilities: handrail/technology-capabilities.md
      - Capability mapping: handrail/capability-mapping.md
      - Reference architectures:
          - handrail/reference-architectures/index.md
          - Transactional digital service: handrail/reference-architectures/transactional-service.md
          - Regulatory casework: handrail/reference-architectures/regulatory-casework.md
          - Data and analytics: handrail/reference-architectures/data-and-analytics.md
  - Governance:
      - governance/index.md
      - Check a decision: governance/decision-check.md
      - Which route do I take?: governance/triage.md
      - Technology Governance Board: governance/tgb.md
      - Technical Design Authority: governance/tda.md
      - Solution design authorities: governance/solution-design-authorities.md
      - Architecture decision records: governance/architecture-decision-records.md
      - Exceptions to guardrails: governance/exceptions.md
      - Templates:
          - governance/templates/index.md
          - Architecture decision record: governance/templates/adr.md
          - TDA submission: governance/templates/tda-submission.md
          - Guardrail exception request: governance/templates/exception-request.md
          - Threat model: governance/templates/threat-model.md
  - Data:
      - data/index.md
      - Defra on a page: data/defra-on-a-page.md
      - Data standards: data/data-standards.md
  - Security:
      - security/index.md
      - Secure by Design: security/secure-by-design.md
      - Threat modelling: security/threat-modelling.md
      - Managing security exceptions: security/managing-exceptions.md
  - Standards and links: standards/index.md
  - Contribute: contribute/index.md

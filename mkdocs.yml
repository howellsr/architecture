site_name: Defra architecture
site_description: >-
  Architecture handrails, guardrails and governance for Defra digital, data and
  technology - for internal product and platform teams and delivery partners.
site_url: https://howellsr.github.io/architecture/
repo_url: https://github.com/howellsr/architecture
repo_name: howellsr/architecture
edit_uri: edit/main/docs/
remote_branch: gh-pages

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
copyright: >-
  Contains public sector information licensed under the
  <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/">Open Government Licence v3.0</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: img/code-white.png
  favicon: img/code-black.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  # Keep hyphenated ids such as GR-HOST-01, NFR-AVL-01 and DDTS-01 as single
  # search terms, so searching for an id finds that guardrail first.
  - search:
      separator: '[\s,:!=\[\]()"/]+|\.(?!\d)'

extra_css:
  - stylesheets/defra.css

extra_javascript:
  - javascripts/site.js

hooks:
  - hooks/capabilities.py
  - hooks/guardrails.py
  - hooks/traceability.py
  - hooks/nfrs.py
  - hooks/delivery.py
  - hooks/patterns.py
  - hooks/page_status.py
  - hooks/cache_busting.py
  - hooks/site_info.py
  - hooks/open_questions.py

extra:
  generator: false
  status:
    draft: Draft - to be confirmed
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DEFRA
      name: Defra on GitHub
    - icon: fontawesome/solid/code
      link: https://defra.github.io/software-development-standards/
      name: Defra software development standards
    - icon: fontawesome/solid/book
      link: https://digital.defra.gov.uk/service-manual
      name: Defra Digital Service Manual
    - icon: fontawesome/solid/blog
      link: https://defradigital.blog.gov.uk/
      name: Defra Digital blog

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true


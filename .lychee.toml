# Link checker settings, used by .github/workflows/links.yml
# https://lychee.cli.rs/

max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
accept = ["200..=299", "429"]

# Local preview addresses, XML namespaces and the site's own future address
exclude = [
  "^http://127\\.0\\.0\\.1",
  "^http://localhost",
  "^http://www\\.w3\\.org/2000/svg",
  "^https://fonts\\.(googleapis|gstatic)\\.com",
  "^https://unpkg\\.com",
]


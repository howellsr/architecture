# Defra and cross-government platforms a delivery team is likely to need.
#
# Rendered on docs/deliver/platforms.md by hooks/delivery.py. Anything we do
# not know yet is left as `tbc` and shown as "To be confirmed" - do not guess.
#
# name:        platform or service name
# capability:  technology capability id (see capabilities/technology-capabilities.yaml)
# gives:       what a team gets from it
# request:     how to request access (Markdown, links relative to docs/)
# lead_time:   how long access usually takes, or tbc
# support:     where to get help (Markdown), or tbc
# docs:        URL of the documentation, or tbc

platforms:
  - id: cdp
    name: Defra Core Delivery Platform (CDP)
    capability: TC21
    gives: Secure-by-default hosting, CI/CD pipelines, observability, secrets management and protective monitoring for new digital services.
    request: Engage the platform team during discovery or alpha ([GR-HOST-01](guardrails/hosting-and-platforms.md#gr-host-01)).
    lead_time: tbc
    support: tbc
    docs: tbc
  - id: defra-id
    name: Defra Identity (Defra ID)
    capability: TC01
    gives: Sign-in for farmers, land managers, businesses and their agents, including acting on behalf of an organisation.
    request: Talk to the identity team in discovery about the level of identity assurance you need and how the service will represent organisations and agents ([GR-IAM-01](guardrails/identity-and-access.md#gr-iam-01)).
    lead_time: tbc
    support: tbc
    docs: tbc
  - id: one-login
    name: GOV.UK One Login
    capability: TC01
    gives: Cross-government sign-in and identity verification for members of the public.
    request: Talk to the Defra identity team first to agree whether your service uses Defra ID, GOV.UK One Login or both. The service then onboards with the GOV.UK One Login team.
    lead_time: tbc
    support: tbc
    docs: https://docs.sign-in.service.gov.uk/
  - id: defra-forms
    name: Defra Forms
    capability: TC03
    gives: A forms capability for form-based services, so you do not need to build a bespoke front end ([GR-FE-04](guardrails/front-end-and-accessibility.md#gr-fe-04)). The capability is emerging.
    request: tbc
    lead_time: tbc
    support: tbc
    docs: tbc
  - id: notify
    name: GOV.UK Notify
    capability: TC04
    gives: Emails, text messages and letters to users, through an API or a web interface.
    request: Create an account on [GOV.UK Notify](https://www.notifications.service.gov.uk/) with your government email address. New services start in trial mode; request to go live from your service's settings.
    lead_time: tbc
    support: "[GOV.UK Notify support](https://www.notifications.service.gov.uk/support)"
    docs: https://docs.notifications.service.gov.uk/
  - id: pay
    name: GOV.UK Pay
    capability: TC05
    gives: Online card and digital wallet payments, with refunds and reporting.
    request: Create a test account on [GOV.UK Pay](https://www.payments.service.gov.uk/). Going live needs Defra's finance arrangements in place.
    lead_time: tbc
    support: tbc
    docs: https://docs.payments.service.gov.uk/
  - id: data-platform
    name: Defra strategic data platform
    capability: TC16
    gives: Shared storage, processing and analytics for Defra data, and governed data products for sharing between services. The capability is emerging.
    request: tbc
    lead_time: tbc
    support: tbc
    docs: tbc
  - id: api-gateway
    name: Platform API gateway and messaging
    capability: TC22
    gives: Publishing, securing and managing APIs, and asynchronous messaging between services, on the Core Delivery Platform.
    request: Through the Core Delivery Platform team.
    lead_time: tbc
    support: tbc
    docs: tbc

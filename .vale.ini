# Prose checks for docs/. See docs/contribute/content-style.md.
# CI reports these as warnings on pull requests; they never fail the build.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Defra

[*.md]
BasedOnStyles = Defra
# Skip HTML comments, which hold build markers.
BlockIgnores = (?s)(<!--.*?-->)
# Skip heading anchors such as {#gr-host-01} and inline code.
TokenIgnores = (`[^`]+`)

# The doctrine and principles use Defra's agreed wording, so do not suggest rewording it.
[docs/principles/*.md]
Defra.WordsToAvoid = NO

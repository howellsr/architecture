<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This site has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>
  (function () {
    var old = '/architecture/';
    var path = window.location.pathname;
    if (path.indexOf(old) === 0) path = path.slice(old.length);
    window.location.replace('https://defra.github.io/architecture/' + path.replace(/^\//, '') + window.location.search + window.location.hash);
  })()
</script>
</head>
<body>
<h1>This site has moved</h1>
<p>The Defra architecture site is now at <a href="https://defra.github.io/architecture/">https://defra.github.io/architecture/</a>.</p>
</body>
</html>

name: backlog-issues

# Creates the labels in .github/labels.yml and one issue for each row of the
# guardrail backlog on docs/about/roadmap.md. Run it by hand from the Actions
# tab after the backlog changes. It is safe to run more than once: labels are
# updated in place and existing issues are skipped. See
# scripts/backlog_issues.py.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issues:
    name: Create labels and backlog issues
    # Issues belong in DEFRA/architecture, not in a fork.
    if: github.repository == 'DEFRA/architecture'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/backlog_issues.py
        env:
          GH_TOKEN: ${{ github.token }}

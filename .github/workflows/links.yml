name: links

# Checks every link on the built site, including external ones, so broken
# references to GOV.UK and other guidance are caught quickly. Runs weekly as
# well as on pull requests, because external pages move without warning.
on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --root-dir "${{ github.workspace }}/site" --exclude "/edit/main/" 'site/**/*.html'
          fail: ${{ github.event_name == 'pull_request' }}
      # On the weekly run, raise an issue rather than failing silently.
      - name: Open an issue for broken links
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: Broken links found on the site
          content-filepath: ./lychee/out.md
          labels: content
